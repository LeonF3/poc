<style>/* ============================================================
   RISK SIGNAL AGGREGATOR — shared tactical design system
   Firstsource STEM POC · Leon Franklin · 2026
   ============================================================ */

:root{
  --bg-page:#0A0A0F;
  --bg-panel:#0D0D14;
  --bg-card:#13131E;
  --bg-item:#16161F;
  --bg-item-hover:#1E1E2E;
  --border:#2A2A3A;
  --purple:#A855F7;
  --purple-light:#C084FC;
  --gold:#F59E0B;
  --text:#E8E3F0;
  --muted:#7A7A9A;
  --red:#EF4444;
  --orange:#F97316;
  --green:#22C55E;

  --nav-h:56px;
  --bar-h:36px;
  --left-w:288px;
  --right-w:308px;

  --f-disp:"Saira Condensed",system-ui,sans-serif;
  --f-body:"Saira",system-ui,sans-serif;
  --f-mono:"Space Mono",ui-monospace,monospace;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg-page);
  color:var(--text);
  font-family:var(--f-body);
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
::selection{background:rgba(168,85,247,.35);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg-panel);}
::-webkit-scrollbar-thumb{background:#22222f;border:1px solid var(--border);}
::-webkit-scrollbar-thumb:hover{background:#2c2c3d;}

/* ---------- App frame ---------- */
.app{display:flex;flex-direction:column;height:100vh;width:100vw;background:
  radial-gradient(1200px 600px at 50% -10%, rgba(168,85,247,.05), transparent 60%),
  var(--bg-page);}
.app__body{flex:1;min-height:0;display:flex;}

/* ---------- Top nav ---------- */
.nav{
  height:var(--nav-h);flex:0 0 var(--nav-h);
  display:flex;align-items:center;gap:18px;
  padding:0 18px;
  background:linear-gradient(180deg,#10101a,#0c0c12);
  border-bottom:1px solid var(--border);
  position:relative;z-index:20;
}
.nav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.4),transparent);}
.brand{display:flex;align-items:center;gap:11px;min-width:var(--left-w);}
.brand__mark{
  width:30px;height:30px;flex:0 0 30px;position:relative;
  display:grid;place-items:center;
  background:linear-gradient(160deg,#1c1430,#120c1f);
  border:1px solid rgba(168,85,247,.5);
  clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);
}
.brand__mark svg{width:15px;height:15px;}
.brand__txt{display:flex;flex-direction:column;line-height:1;}
.brand__name{font-family:var(--f-disp);font-weight:900;font-size:.96rem;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;}
.brand__sub{font-family:var(--f-mono);font-size:.52rem;letter-spacing:2px;color:var(--muted);margin-top:3px;text-transform:uppercase;}

.tabs{display:flex;gap:4px;flex:1;justify-content:center;}
.tab{
  font-family:var(--f-disp);font-weight:700;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);text-decoration:none;
  padding:0 16px;height:36px;display:inline-flex;align-items:center;gap:7px;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
  position:relative;white-space:nowrap;
}
.tab:hover{color:var(--text);}
.tab[aria-current="page"]{color:var(--gold);border-bottom-color:var(--gold);}
.tab[aria-current="page"]::before{content:"";position:absolute;inset:auto 0 -1px;height:18px;top:auto;
  background:radial-gradient(60% 100% at 50% 100%,rgba(245,158,11,.18),transparent);pointer-events:none;}

.nav__right{display:flex;align-items:center;gap:18px;min-width:var(--left-w);justify-content:flex-end;}
.status-dot{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.status-dot i{width:7px;height:7px;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;animation:pulse 2.4s infinite;}
.user-chip{display:inline-flex;align-items:center;gap:9px;padding:6px 12px;background:var(--bg-item);border:1px solid var(--border);}
.user-chip .av{width:22px;height:22px;background:linear-gradient(160deg,var(--purple),#5b2a8c);display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:.7rem;color:#fff;}
.user-chip .nm{font-family:var(--f-disp);font-weight:700;font-size:.74rem;letter-spacing:1.5px;text-transform:uppercase;}

/* ---------- Bottom status bar ---------- */
.statusbar{
  height:var(--bar-h);flex:0 0 var(--bar-h);
  display:flex;align-items:center;gap:22px;padding:0 18px;
  background:linear-gradient(180deg,#0c0c12,#08080c);
  border-top:1px solid var(--border);font-family:var(--f-mono);
  font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
  position:relative;z-index:20;
}
.statusbar .stat{display:inline-flex;align-items:center;gap:8px;}
.statusbar .stat b{font-family:var(--f-disp);font-weight:900;font-size:.85rem;letter-spacing:1px;}
.statusbar .stat--red b{color:var(--red);} .statusbar .stat--red .ic{color:var(--red);}
.statusbar .stat--purple b{color:var(--purple-light);}
.statusbar .stat--gold b{color:var(--gold);}
.statusbar .sep{width:1px;height:16px;background:var(--border);}
.statusbar .spacer{flex:1;}
.statusbar .range{color:var(--muted);}

/* ---------- Generic atoms ---------- */
.sec-h{font-family:var(--f-disp);font-weight:700;font-size:.66rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--purple-light);
  display:flex;align-items:center;gap:9px;}
.sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.sec-h .ic{color:var(--purple);}

.meter{height:7px;background:#1E1E2E;width:100%;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.03);}
.meter > i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);background:currentColor;
  box-shadow:0 0 10px currentColor;}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;font-family:var(--f-disp);font-weight:700;
  font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;line-height:1;border:1px solid transparent;white-space:nowrap;}
.badge--urgent{color:var(--red);background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35);}
.badge--review{color:var(--orange);background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.35);}
.badge--monitor{color:var(--green);background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.35);}

.tlabel{font-family:var(--f-disp);font-weight:900;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}

.btn{font-family:var(--f-disp);font-weight:700;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;
  width:100%;text-align:left;padding:11px 14px;border:1px solid var(--border);background:var(--bg-item);color:var(--text);
  cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .15s,border-color .15s,color .15s;}
.btn:hover{background:var(--bg-item-hover);border-color:#3a3a4f;}
.btn--primary{background:linear-gradient(180deg,var(--purple),#7c3aed);border-color:var(--purple-light);color:#fff;
  box-shadow:0 0 0 1px rgba(168,85,247,.3),0 8px 24px -12px rgba(168,85,247,.8);}
.btn--primary:hover{background:linear-gradient(180deg,#b066f9,#8a44f0);}
.btn .k{margin-left:auto;font-family:var(--f-mono);font-size:.6rem;color:rgba(255,255,255,.6);}

.mono{font-family:var(--f-mono);}
.muted{color:var(--muted);}

@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes scan{0%{transform:translateY(-100%);}100%{transform:translateY(2000%);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
<style>
/* ---------- Screen 1: dashboard layout ---------- */
.dash{flex:1;min-height:0;display:grid;grid-template-columns:var(--left-w) 1fr var(--right-w);}
.panel{min-height:0;overflow:auto;background:var(--bg-panel);display:flex;flex-direction:column;}
.panel--l{border-right:1px solid var(--border);padding:18px 16px;gap:20px;}
.panel--r{border-left:1px solid var(--border);padding:18px 16px;gap:18px;}

/* Upload box */
.uploadbox{border:1.5px dashed rgba(168,85,247,.55);background:linear-gradient(180deg,#15101f,#100c19);
  padding:22px 14px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s;}
.uploadbox:hover{background:#181225;border-color:var(--purple-light);}
.uploadbox .ic{font-size:1.5rem;}
.uploadbox .t{font-family:var(--f-disp);font-weight:700;font-size:.82rem;letter-spacing:1.5px;text-transform:uppercase;margin-top:8px;}
.uploadbox .s{font-family:var(--f-mono);font-size:.6rem;color:var(--muted);margin-top:5px;letter-spacing:1px;}
.col{display:flex;flex-direction:column;gap:8px;}
.col--tight{gap:2px;}

/* Signal list */
.sig{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--bg-item);
  border-left:3px solid var(--border);cursor:default;transition:background .15s;}
.sig:hover{background:var(--bg-item-hover);}
.sig--hit{border-left-color:var(--gold);}
.sig .chev{font-family:var(--f-mono);color:var(--muted);font-size:.72rem;}
.sig .nm{font-family:var(--f-disp);font-weight:600;font-size:.78rem;letter-spacing:1.2px;text-transform:uppercase;flex:1;color:#b9b4c6;}
.sig--hit .nm{color:var(--text);}
.sig .ct{font-family:var(--f-disp);font-weight:900;font-size:.86rem;min-width:22px;text-align:right;color:var(--muted);}
.sig--hit .ct{color:var(--purple-light);}

.panel-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
.loaded{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
.loaded i{width:7px;height:7px;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.4s infinite;}
.powered{font-family:var(--f-mono);font-size:.56rem;letter-spacing:1.5px;color:#4a4a63;text-transform:uppercase;}

/* Center stage */
.stage{position:relative;min-height:0;overflow:hidden;background:#05050a;}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92;}
.stage__grade{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,var(--bg-panel) 0%,rgba(13,13,20,.35) 14%,transparent 32%,transparent 68%,rgba(13,13,20,.35) 86%,var(--bg-panel) 100%),
  linear-gradient(0deg,var(--bg-page) 0%,rgba(10,10,15,.4) 16%,transparent 38%),
  radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(5,5,10,.55) 100%);}
.stage__scan{position:absolute;left:0;right:0;height:90px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(168,85,247,.05) 45%,rgba(192,132,252,.09) 50%,rgba(168,85,247,.05) 55%,transparent);
  animation:scan 7s linear infinite;mix-blend-mode:screen;}
.stage__badge{position:absolute;top:20px;left:50%;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:9px;padding:8px 16px;
  background:rgba(60,30,95,.55);border:1px solid rgba(168,85,247,.5);backdrop-filter:blur(6px);}
.stage__badge .sh{width:14px;height:14px;}
.stage__badge .rank{font-family:var(--f-disp);font-weight:900;font-size:.8rem;color:var(--gold);letter-spacing:1px;}
.stage__badge .nm{font-family:var(--f-disp);font-weight:700;font-size:.82rem;letter-spacing:2.5px;text-transform:uppercase;}
.stage__status{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);text-align:center;}
.stage__status .ln{font-family:var(--f-disp);font-weight:700;font-size:.95rem;letter-spacing:3px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:10px;}
.stage__status.awaiting .ln{color:var(--gold);animation:pulse 1.8s infinite;}
.stage__status.complete .ln{color:var(--green);}
.stage__status .sub{font-family:var(--f-mono);font-size:.6rem;letter-spacing:2px;color:var(--muted);margin-top:7px;text-transform:uppercase;}
.stage__corner{position:absolute;font-family:var(--f-mono);font-size:.56rem;letter-spacing:2px;color:rgba(232,227,240,.4);text-transform:uppercase;}
.stage__corner--tl{top:16px;left:18px;} .stage__corner--tr{top:16px;right:18px;}
.stage__recticle{position:absolute;top:16px;right:18px;display:flex;align-items:center;gap:8px;}
.stage__recticle i{width:6px;height:6px;background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1.2s infinite;}

/* Right: active threats */
.rtotal{display:flex;align-items:baseline;gap:8px;}
.rtotal b{font-family:var(--f-disp);font-weight:900;font-size:2.4rem;line-height:.9;color:var(--text);}
.rtotal span{font-family:var(--f-disp);font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}

.tcard{background:var(--bg-item);border-left:3px solid var(--c);padding:11px 12px;display:flex;flex-direction:column;gap:7px;
  cursor:pointer;transition:background .15s,transform .15s;}
.tcard:hover{background:var(--bg-item-hover);transform:translateX(2px);}
.tcard__top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.tcard__sig{font-family:var(--f-disp);font-weight:700;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--c);}
.tcard__id{font-family:var(--f-mono);font-size:.58rem;color:var(--muted);}
.tcard__nm{font-family:var(--f-disp);font-weight:600;font-size:.92rem;letter-spacing:.5px;}
.tcard__meter{display:flex;align-items:center;gap:9px;}
.tcard__meter .meter{color:var(--c);flex:1;}
.tcard__sc{font-family:var(--f-disp);font-weight:900;font-size:.82rem;color:var(--c);min-width:46px;text-align:right;}
.tcard__sc small{color:var(--muted);font-weight:600;font-size:.62rem;}

.priority{background:var(--bg-card);border-top:3px solid var(--c);padding:14px;display:flex;flex-direction:column;gap:10px;}
.priority__hd{display:flex;align-items:center;justify-content:space-between;}
.priority__nm{font-family:var(--f-disp);font-weight:700;font-size:1rem;letter-spacing:.5px;}
.priority__id{font-family:var(--f-mono);font-size:.58rem;color:var(--muted);}
.priority__why{font-style:italic;font-size:.8rem;line-height:1.55;color:#cfc8da;border-left:2px solid var(--purple);padding-left:11px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.priority .badge{width:100%;justify-content:center;padding:9px;}
.priority__meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.56rem;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}

.scanning .tcard__meter .meter > i{animation:none;}

/* Signal type dropdown names */
.sig-names{display:flex;flex-direction:column;gap:1px;margin-bottom:2px;}
.sig-name{
  font-family:var(--f-body);font-size:.72rem;color:var(--text);
  padding:5px 12px 5px 26px;cursor:pointer;
  background:var(--bg-item);border-left:2px solid var(--purple);
  transition:background .12s,color .12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sig-name:hover{background:var(--bg-item-hover);color:var(--purple-light);}
.sig--open .chev{color:var(--purple-light);}
</style>
</head>

    </main>
  </div>

      _stagedContent = e.target.result;
      _stagedName    = file.name;
      setStatus("awaiting","📁","File Staged", file.name+" ready — click Initiate Analysis");
      var loadedEl = document.querySelector(".loaded");
      if (loadedEl) loadedEl.innerHTML = "<i></i> "+file.name+" staged";
    };
    reader.readAsText(file);
  }

  dropEl.addEventListener("dragover",  function(e){ e.preventDefault(); this.style.borderColor="var(--purple-light)"; });
  dropEl.addEventListener("dragleave", function(){   this.style.borderColor=""; });
  dropEl.addEventListener("drop",      function(e){
    e.preventDefault(); this.style.borderColor="";
    var file = e.dataTransfer.files[0];
    if (file) stageFile(file);
  });
  fileInput.addEventListener("change", function(){
    if (this.files[0]) stageFile(this.files[0]);
  });

  smpBtn.addEventListener("click", function(){
    _stagedContent = null; _stagedName = null;
    runAnalysis(null, null);
  });

  initBtn.addEventListener("click", function(){
    runAnalysis(_stagedContent, _stagedName);
  });
})();
</script>
</body>
</html>
