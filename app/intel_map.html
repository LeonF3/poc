<style>/* ============================================================
   RISK SIGNAL AGGREGATOR — shared tactical design system
   Firstsource STEM POC · Leon Franklin · 2026
   ============================================================ */

:root{
  --bg-page:#0A0A0F;
  --bg-panel:#0D0D14;
  --bg-card:#13131E;
  --bg-item:#16161F;
  --bg-item-hover:#1E1E2E;
  --border:#2A2A3A;
  --purple:#A855F7;
  --purple-light:#C084FC;
  --gold:#F59E0B;
  --text:#E8E3F0;
  --muted:#7A7A9A;
  --red:#EF4444;
  --orange:#F97316;
  --green:#22C55E;

  --nav-h:56px;
  --bar-h:36px;
  --left-w:288px;
  --right-w:308px;

  --f-disp:"Saira Condensed",system-ui,sans-serif;
  --f-body:"Saira",system-ui,sans-serif;
  --f-mono:"Space Mono",ui-monospace,monospace;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg-page);
  color:var(--text);
  font-family:var(--f-body);
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
::selection{background:rgba(168,85,247,.35);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg-panel);}
::-webkit-scrollbar-thumb{background:#22222f;border:1px solid var(--border);}
::-webkit-scrollbar-thumb:hover{background:#2c2c3d;}

/* ---------- App frame ---------- */
.app{display:flex;flex-direction:column;height:100vh;width:100vw;background:
  radial-gradient(1200px 600px at 50% -10%, rgba(168,85,247,.05), transparent 60%),
  var(--bg-page);}
.app__body{flex:1;min-height:0;display:flex;}

/* ---------- Top nav ---------- */
.nav{
  height:var(--nav-h);flex:0 0 var(--nav-h);
  display:flex;align-items:center;gap:18px;
  padding:0 18px;
  background:linear-gradient(180deg,#10101a,#0c0c12);
  border-bottom:1px solid var(--border);
  position:relative;z-index:20;
}
.nav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.4),transparent);}
.brand{display:flex;align-items:center;gap:11px;min-width:var(--left-w);}
.brand__mark{
  width:30px;height:30px;flex:0 0 30px;position:relative;
  display:grid;place-items:center;
  background:linear-gradient(160deg,#1c1430,#120c1f);
  border:1px solid rgba(168,85,247,.5);
  clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);
}
.brand__mark svg{width:15px;height:15px;}
.brand__txt{display:flex;flex-direction:column;line-height:1;}
.brand__name{font-family:var(--f-disp);font-weight:900;font-size:.96rem;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;}
.brand__sub{font-family:var(--f-mono);font-size:.52rem;letter-spacing:2px;color:var(--muted);margin-top:3px;text-transform:uppercase;}

.tabs{display:flex;gap:4px;flex:1;justify-content:center;}
.tab{
  font-family:var(--f-disp);font-weight:700;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);text-decoration:none;
  padding:0 16px;height:36px;display:inline-flex;align-items:center;gap:7px;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
  position:relative;white-space:nowrap;
}
.tab:hover{color:var(--text);}
.tab[aria-current="page"]{color:var(--gold);border-bottom-color:var(--gold);}
.tab[aria-current="page"]::before{content:"";position:absolute;inset:auto 0 -1px;height:18px;top:auto;
  background:radial-gradient(60% 100% at 50% 100%,rgba(245,158,11,.18),transparent);pointer-events:none;}

.nav__right{display:flex;align-items:center;gap:18px;min-width:var(--left-w);justify-content:flex-end;}
.status-dot{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.status-dot i{width:7px;height:7px;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;animation:pulse 2.4s infinite;}
.user-chip{display:inline-flex;align-items:center;gap:9px;padding:6px 12px;background:var(--bg-item);border:1px solid var(--border);}
.user-chip .av{width:22px;height:22px;background:linear-gradient(160deg,var(--purple),#5b2a8c);display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:.7rem;color:#fff;}
.user-chip .nm{font-family:var(--f-disp);font-weight:700;font-size:.74rem;letter-spacing:1.5px;text-transform:uppercase;}

/* ---------- Bottom status bar ---------- */
.statusbar{
  height:var(--bar-h);flex:0 0 var(--bar-h);
  display:flex;align-items:center;gap:22px;padding:0 18px;
  background:linear-gradient(180deg,#0c0c12,#08080c);
  border-top:1px solid var(--border);font-family:var(--f-mono);
  font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
  position:relative;z-index:20;
}
.statusbar .stat{display:inline-flex;align-items:center;gap:8px;}
.statusbar .stat b{font-family:var(--f-disp);font-weight:900;font-size:.85rem;letter-spacing:1px;}
.statusbar .stat--red b{color:var(--red);} .statusbar .stat--red .ic{color:var(--red);}
.statusbar .stat--purple b{color:var(--purple-light);}
.statusbar .stat--gold b{color:var(--gold);}
.statusbar .sep{width:1px;height:16px;background:var(--border);}
.statusbar .spacer{flex:1;}
.statusbar .range{color:var(--muted);}

/* ---------- Generic atoms ---------- */
.sec-h{font-family:var(--f-disp);font-weight:700;font-size:.66rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--purple-light);
  display:flex;align-items:center;gap:9px;}
.sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.sec-h .ic{color:var(--purple);}

.meter{height:7px;background:#1E1E2E;width:100%;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.03);}
.meter > i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);background:currentColor;
  box-shadow:0 0 10px currentColor;}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;font-family:var(--f-disp);font-weight:700;
  font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;line-height:1;border:1px solid transparent;white-space:nowrap;}
.badge--urgent{color:var(--red);background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35);}
.badge--review{color:var(--orange);background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.35);}
.badge--monitor{color:var(--green);background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.35);}

.tlabel{font-family:var(--f-disp);font-weight:900;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}

.btn{font-family:var(--f-disp);font-weight:700;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;
  width:100%;text-align:left;padding:11px 14px;border:1px solid var(--border);background:var(--bg-item);color:var(--text);
  cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .15s,border-color .15s,color .15s;}
.btn:hover{background:var(--bg-item-hover);border-color:#3a3a4f;}
.btn--primary{background:linear-gradient(180deg,var(--purple),#7c3aed);border-color:var(--purple-light);color:#fff;
  box-shadow:0 0 0 1px rgba(168,85,247,.3),0 8px 24px -12px rgba(168,85,247,.8);}
.btn--primary:hover{background:linear-gradient(180deg,#b066f9,#8a44f0);}
.btn .k{margin-left:auto;font-family:var(--f-mono);font-size:.6rem;color:rgba(255,255,255,.6);}

.mono{font-family:var(--f-mono);}
.muted{color:var(--muted);}

@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes scan{0%{transform:translateY(-100%);}100%{transform:translateY(2000%);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
<style>
/* ---------- Screen 3: intel map ---------- */
.intel{flex:1;min-height:0;overflow:auto;background:var(--bg-page);}
.intel__inner{max-width:1280px;margin:0 auto;padding:22px 24px 40px;display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}

.chartcard{background:var(--bg-card);border:1px solid var(--border);}
.chartcard__hd{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);}
.chartcard__hd h1{font-family:var(--f-disp);font-weight:900;font-size:1.25rem;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
.chartcard__hd .ic{color:var(--purple);}
.legend{display:flex;gap:14px;font-family:var(--f-mono);font-size:.58rem;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;}

.chart{padding:20px 18px 14px;}
.bar{display:grid;grid-template-columns:128px 1fr 36px;align-items:center;gap:14px;padding:7px 0;}
.bar__lbl{font-family:var(--f-disp);font-weight:600;font-size:.74rem;letter-spacing:1px;text-transform:uppercase;text-align:right;color:#b9b4c6;}
.bar__track{position:relative;height:22px;background:#0d0d14;border:1px solid var(--border);}
.bar__track::before,.bar__track::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.04);}
.bar__track::before{left:33.3%;} .bar__track::after{left:66.6%;}
.bar__fill{position:absolute;inset:0 auto 0 0;display:flex;height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);}
.bar__seg{height:100%;}
.bar__seg--h{background:var(--red);} .bar__seg--m{background:var(--gold);} .bar__seg--l{background:var(--green);}
.bar__val{font-family:var(--f-disp);font-weight:900;font-size:.84rem;text-align:left;}
.chart__axis{display:grid;grid-template-columns:128px 1fr 36px;gap:14px;margin-top:6px;}
.chart__ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.56rem;color:var(--muted);}
.chart__axislabel{grid-column:2;text-align:center;font-family:var(--f-mono);font-size:.58rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-top:8px;}

.side{display:flex;flex-direction:column;gap:20px;}
.sidecard{background:var(--bg-card);border:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:13px;}
.brk{display:flex;flex-direction:column;gap:5px;}
.brk__top{display:flex;align-items:center;justify-content:space-between;}
.brk__lbl{font-family:var(--f-disp);font-weight:700;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--c);}
.brk__lbl i{width:8px;height:8px;background:var(--c);box-shadow:0 0 8px var(--c);}
.brk__n{font-family:var(--f-disp);font-weight:900;font-size:1.1rem;color:var(--c);}
.brk .meter{color:var(--c);}
.scount{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b1b27;}
.scount:last-child{border-bottom:0;}
.scount__nm{font-family:var(--f-disp);font-weight:600;font-size:.74rem;letter-spacing:1px;text-transform:uppercase;color:#b9b4c6;white-space:nowrap;}
.scount__n{font-family:var(--f-mono);font-size:.74rem;color:var(--purple-light);}
.scount__n.zero{color:var(--muted);}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);}
.kpi{background:var(--bg-card);padding:13px;text-align:center;}
.kpi b{font-family:var(--f-disp);font-weight:900;font-size:1.7rem;display:block;line-height:1;}
.kpi span{font-family:var(--f-mono);font-size:.54rem;letter-spacing:1px;color:var(--muted);text-transform:uppercase;display:block;margin-top:5px;}
</style>
</head>

      </div>

  </div>
</div>

      evidence:"Single low-value overdraft.",
      rationale:"Lowest-priority flag in the queue; no corroborating signals.",
      directive:"No action." }
  ];

  // ---- Derivation helpers ----
  function level(score){
    if (score >= 90) return { key:"CRITICAL", label:"CRITICAL", color:"var(--red)",    hex:"#EF4444", glyph:"☠" };
    if (score >= 70) return { key:"THREAT",   label:"THREAT",   color:"var(--orange)", hex:"#F97316", glyph:"✖" };
    if (score >= 45) return { key:"CAUTION",  label:"CAUTION",  color:"var(--gold)",   hex:"#F59E0B", glyph:"▲" };
    return                   { key:"MONITOR", label:"MONITOR",  color:"var(--green)",  hex:"#22C55E", glyph:"●" };
  }
  function mission(score){
    if (score >= 70) return { key:"URGENT",  cls:"urgent",  glyph:"⚡", text:"IMMEDIATE ACTION", color:"var(--red)",    hex:"#EF4444", bg:"#2D0A0A" };
    if (score >= 45) return { key:"REVIEW",  cls:"review",  glyph:"🔍", text:"INVESTIGATE",      color:"var(--orange)", hex:"#F97316", bg:"#2D1A0A" };
    return                   { key:"MONITOR", cls:"monitor", glyph:"👁", text:"WATCH LIST",       color:"var(--green)",  hex:"#22C55E", bg:"#0A2D0A" };
  }
  function signalOf(key){ for (var i=0;i<SIGNALS.length;i++) if (SIGNALS[i].key===key) return SIGNALS[i]; return {short:key,full:key,key:key}; }

  // Attach rank + derived fields, ensure sorted desc.
  CASES.sort(function(a,b){ return b.score - a.score; });
  CASES.forEach(function(c,i){
    c.rank = i + 1;
    c.id = "#" + String(i + 1).padStart(3, "0");
    c.level = level(c.score);
    c.mission = mission(c.score);
    c.sig = signalOf(c.signal);
  });

  // Per-signal counts (taxonomy order).
  var SIGNAL_COUNTS = SIGNALS.map(function (s) {
    return { signal: s, count: CASES.filter(function (c) { return c.signal === s.key; }).length };
  });

  var STATS = {
    total: CASES.length,
    immediate: CASES.filter(function (c) { return c.score >= 45; }).length, // URGENT + REVIEW
    flagged:   CASES.filter(function (c) { return c.score >= 70; }).length, // suspects flagged
    high:      CASES.filter(function (c) { return c.score >= 70; }).length,
    medium:    CASES.filter(function (c) { return c.score >= 45 && c.score < 70; }).length,
    low:       CASES.filter(function (c) { return c.score < 45; }).length,
    txnLoaded: 500,
    rangeStart: "2026-03-06",
    rangeEnd:   "2026-06-04"
  };

  global.RSA = {
    SIGNALS: SIGNALS, CASES: CASES, SIGNAL_COUNTS: SIGNAL_COUNTS, STATS: STATS,
    level: level, mission: mission, signalOf: signalOf,
    analyst: "LEON FRANKLIN"
  };
})(typeof window !== "undefined" ? window : this);

<script>/* ============================================================
   RISK SIGNAL AGGREGATOR — shared chrome (nav + status bar)
   ============================================================ */
(function (global) {
  "use strict";
  var R = global.RSA;

  var SHIELD =
    '<svg viewBox="0 0 24 24" fill="none" stroke="#C084FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3Z"/><path d="M12 8v4" stroke="#F59E0B"/><circle cx="12" cy="15.5" r=".6" fill="#F59E0B" stroke="#F59E0B"/></svg>';

  var TABS = [
    { id:"upload",   label:"Upload",    href:"upload.html" },
    { id:"cases",    label:"Case Files",href:"case_files.html" },
    { id:"intel",    label:"Intel Map", href:"intel_map.html" },
    { id:"about",    label:"About",     href:"about.html" }
  ];

  function esc(s){ return String(s).replace(/[&<>"]/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }

  function renderNav(active){
    var tabs = TABS.map(function(t){
      var cur = t.id === active ? ' aria-current="page"' : "";
      return '<a class="tab" href="'+t.href+'"'+cur+'>'+t.label.toUpperCase()+'</a>';
    }).join("");
    var initials = R.analyst.split(" ").map(function(w){return w[0];}).join("").slice(0,2);
    return ''+
    '<header class="nav">'+
      '<div class="brand">'+
        '<span class="brand__mark">'+SHIELD+'</span>'+
        '<span class="brand__txt">'+
          '<span class="brand__name">Risk Signal Aggregator</span>'+
          '<span class="brand__sub">Financial Threat Intelligence</span>'+
        '</span>'+
      '</div>'+
      '<nav class="tabs">'+tabs+'</nav>'+
      '<div class="nav__right">'+
        '<span class="status-dot"><i></i> System Online</span>'+
        '<span class="user-chip"><span class="av">'+esc(initials)+'</span><span class="nm">'+esc(R.analyst)+'</span></span>'+
      '</div>'+
    '</header>';
  }

  function renderStatusbar(){
    var s = R.STATS;
    return ''+
    '<footer class="statusbar">'+
      '<span class="stat stat--red"><span class="ic">⚡</span> <b>'+s.immediate+'</b> Immediate Action</span>'+
      '<span class="sep"></span>'+
      '<span class="stat stat--purple"><b>'+s.flagged+'</b> Suspects Flagged</span>'+
      '<span class="sep"></span>'+
      '<span class="stat stat--gold"><b>'+s.total+'</b> Total Threats</span>'+
      '<span class="spacer"></span>'+
      '<span class="range">Window '+s.rangeStart+' &nbsp;–&nbsp; '+s.rangeEnd+'</span>'+
    '</footer>';
  }

  // width helper for meters (clamped)
  function pct(score){ return Math.max(3, Math.min(100, score)); }

  R.ui = { renderNav:renderNav, renderStatusbar:renderStatusbar, esc:esc, pct:pct, SHIELD:SHIELD, TABS:TABS };
})(typeof window !== "undefined" ? window : this);
</script>
<script>
(function(){
  var R = window.RSA, ui = R.ui, esc = ui.esc;

  // Load analysis results persisted from Upload tab
  (function(){
    try {
      var d = JSON.parse(localStorage.getItem("rsa_data") || "null");
      if (!d) return;
      if (d.CASES)         R.CASES         = d.CASES;
      if (d.SIGNAL_COUNTS) R.SIGNAL_COUNTS = d.SIGNAL_COUNTS;
      if (d.STATS) {
        R.STATS.total      = d.STATS.total;
        R.STATS.flagged    = d.STATS.flagged;
        R.STATS.immediate  = d.STATS.immediate;
        R.STATS.rangeStart = d.STATS.rangeStart;
        R.STATS.rangeEnd   = d.STATS.rangeEnd;
        R.STATS.txnLoaded  = d.STATS.txnCount || R.STATS.txnLoaded;
      }
    } catch(e) {}
  })();

  document.querySelector(".app").insertAdjacentHTML("afterbegin", ui.renderNav("intel"));
  document.querySelector(".app").insertAdjacentHTML("beforeend", ui.renderStatusbar());

  // per-signal tiered counts
  var rows = R.SIGNAL_COUNTS.map(function(sc){
    var cs = R.CASES.filter(function(c){return c.signal===sc.signal.key;});
    return { sig:sc.signal, total:sc.count,
      h:cs.filter(function(c){return c.score>=70;}).length,
      m:cs.filter(function(c){return c.score>=45&&c.score<70;}).length,
      l:cs.filter(function(c){return c.score<45;}).length };
  }).sort(function(a,b){return b.total-a.total;});

  var max = Math.max.apply(null, rows.map(function(r){return r.total;}));
  var axisMax = Math.ceil(max); // ticks 0..max

  document.getElementById("chart").innerHTML =
    rows.map(function(r){
      var w = (r.total/axisMax)*100;
      var seg = function(n,cls){ return n? '<span class="bar__seg bar__seg--'+cls+'" style="width:'+(n/r.total*100)+'%"></span>':''; };
      var col = r.h? 'var(--red)' : r.m? 'var(--gold)' : 'var(--green)';
      return '<div class="bar">'+
        '<span class="bar__lbl">'+esc(r.sig.short)+'</span>'+
        '<span class="bar__track"><span class="bar__fill" data-w="'+w+'">'+seg(r.h,"h")+seg(r.m,"m")+seg(r.l,"l")+'</span></span>'+
        '<span class="bar__val" style="color:'+col+'">'+r.total+'</span></div>';
    }).join("") +
    '<div class="chart__axis"><div class="chart__ticks" style="grid-column:2">'+
      [0,Math.round(axisMax/3),Math.round(axisMax*2/3),axisMax].map(function(t){return '<span>'+t+'</span>';}).join("")+
      '</div></div><div class="chart__axislabel">Findings per signal</div>';

  // animate bars
  setTimeout(function(){ document.querySelectorAll(".bar__fill").forEach(function(el){ el.style.width=el.dataset.w+"%"; }); }, 120);

  // breakdown
  var s = R.STATS, tot = s.total;
  var brk = [
    { label:"High",   n:s.high,   c:"var(--red)" },
    { label:"Medium", n:s.medium, c:"var(--gold)" },
    { label:"Low",    n:s.low,    c:"var(--green)" }
  ];
  document.getElementById("breakdown").innerHTML = brk.map(function(b){
    return '<div class="brk" style="--c:'+b.c+'">'+
      '<div class="brk__top"><span class="brk__lbl"><i></i>'+b.label+'</span><span class="brk__n">'+b.n+'</span></div>'+
      '<span class="meter"><i style="width:'+(b.n/tot*100)+'%"></i></span></div>';
  }).join("");
  setTimeout(function(){ document.querySelectorAll("#breakdown .meter > i").forEach(function(el){ var w=el.style.width; el.style.width=0; requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.width=w;});}); }); }, 200);

  // signal counts
  document.getElementById("signalcounts").innerHTML = R.SIGNAL_COUNTS.map(function(sc){
    return '<div class="scount"><span class="scount__nm">'+esc(sc.signal.short)+'</span>'+
      '<span class="scount__n '+(sc.count?"":"zero")+'">'+sc.count+'</span></div>';
  }).join("");

  // kpis
  document.getElementById("kpis").innerHTML =
    '<div class="kpi"><b style="color:var(--text)">'+s.txnLoaded+'</b><span>Txns Scanned</span></div>'+
    '<div class="kpi"><b style="color:var(--gold)">'+R.SIGNALS.length+'</b><span>Detectors</span></div>'+
    '<div class="kpi"><b style="color:var(--red)">'+s.flagged+'</b><span>Flagged</span></div>'+
    '<div class="kpi"><b style="color:var(--purple-light)">'+s.total+'</b><span>Total Threats</span></div>';
})();
</script>
